name: cargo-deny
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    timeout-minutes: 10
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  # NOTE: timeout-minutes moved to jobs.<id>.timeout-minutes; push-level
  # timeout-minutes is ignored and was causing the duplicate-key warning.

jobs:
  cargo-deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: EmbarkStudios/cargo-deny-action@91bf2b620e09e18d6eb78b92e7861937469acedb # v2
        with:
          command: check advisories licenses

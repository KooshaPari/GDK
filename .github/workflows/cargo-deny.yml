name: cargo-deny
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  push:
    branches: [main]
    timeout-minutes: 10
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  cargo-deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: EmbarkStudios/cargo-deny-action@v6
        with:
          command: check advisories licenses

name: cargo-semver-checks
permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    paths: ['**/Cargo.toml']
  workflow_dispatch:

jobs:
  semver-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: obi1kenobi/cargo-semver-checks-action@v2

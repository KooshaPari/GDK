name: CI

on:

  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust-check:
    timeout-minutes: 45
    name: Rust Quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@a45951ff880207c249adf57334cf2e9bd81d6e1e
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (warnings = errors)
        run: cargo clippy --lib -- -D warnings
      - name: Build
        run: cargo build --all-features --workspace
      - name: Test
        run: cargo test --workspace

  rust-build:
    name: Rust Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2
      - uses: Swatinem/rust-cache@a45951ff880207c249adf57334cf2e9bd81d6e1e
      - name: Build
        run: cargo build --all-features --workspace

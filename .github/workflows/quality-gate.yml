# Generated quality gate workflow - calls reusable phenotype workflow
name: Quality Gate

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main, master]
    timeout-minutes: 20

permissions:
  contents: read

jobs:
  quality:
    uses: KooshaPari/phenotype-infrakit/.github/workflows/quality-gate.yml@c894caa3f54e88a83791a5a5aed9ceddec552387
    secrets: inherit

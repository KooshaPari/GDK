# Generated quality gate workflow - calls reusable phenotype workflow
name: Quality Gate

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  quality:
    uses: KooshaPari/phenotype-infrakit/.github/workflows/quality-gate.yml@0000000000000000000000000000000000000000 # placeholder SHA; source 404s; replace when reachable
    secrets: inherit

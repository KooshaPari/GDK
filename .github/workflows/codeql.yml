name: CodeQL
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  push:
    branches: [main]
    timeout-minutes: 20
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    uses: KooshaPari/phenoShared/.github/workflows/codeql.yml@136def14b63e59da150eae1dc525677746098dd0
    permissions:
      contents: read
      actions: read
      security-events: write
    with:
      languages: '["actions"]'
      build-mode: 'autobuild'

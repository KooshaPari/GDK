[advisories]
db-path = "$CARGO_HOME/advisory-db"
# RUSTSEC advisories that are accepted with justification
# Add entries here when an advisory is reviewed and accepted:
# [RUSTSEC-YYYY-NNNN]
# reason = "Justification for accepting this advisory"
# expires = "YYYY-MM-DD"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "0BSD",
    "CC0-1.0",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

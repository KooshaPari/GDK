[advisories]
db-path = "$CARGO_HOME/advisory-db"

[[advisories.ignore]]
id = "RUSTSEC-2024-0320"
reason = "yaml-rust unmaintained; no safe upgrade available; scheduled for future refactor to serde_yaml"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "0BSD",
    "CC0-1.0",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
